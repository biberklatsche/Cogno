[package]
name = "cogno"
version = "0.4.0"
description = "A terminal workspace for focused daily shell work"
authors = ["Lars Wolfram"]
edition = "2021"
license = "MPL-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cogno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = { version = "2.4.2", features = ["watch"] }
tauri-plugin-log = "2.7.0"
tauri-plugin-os = "2.3.1"
tauri-plugin-window-state = "2.4.0"
portable-pty = "0.8"
which = "5"
hex = "0.4"
ring = "0.16.20"
dirs = "6.0.0"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
uuid = { version = "1.11", features = ["v4"] }
sysinfo = "0.33"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json"] }
# `bundled` compiles SQLite into the binary so every platform runs the same
# version, with FTS5 included (needed for the trigram command search index).
rusqlite = { version = "0.40", features = ["bundled"] }
log = "0.4"
axum = "0.7"
tokio = { version = "1", features = ["net"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
tauri-winrt-notification = "0.7"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
notify-rust = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
panic = "abort"
